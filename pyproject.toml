[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-bench"
version = "0.3.3"
description = "Reproducible local benchmarks for image tagging models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "TimeOfAnarchy"}]
dependencies = ["numpy>=2.0,<3", "Pillow>=11,<13", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.22,<2"]
dml = ["onnxruntime-directml>=1.22,<2; platform_system == 'Windows'"]
cuda = ["onnxruntime-gpu>=1.22,<2"]
torch = ["torch>=2.6,<3", "timm>=1.0.30,<2", "safetensors>=0.5,<1"]
dev = ["pytest>=8,<10", "onnx>=1.17,<2", "build>=1.2,<2", "ruff>=0.12,<1"]
demo = ["onnx>=1.17,<2"]

[project.scripts]
vision-bench = "vision_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vision_bench = ["profiles/*.json", "vlm_examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".local", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
